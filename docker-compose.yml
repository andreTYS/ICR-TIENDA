services:
  tienda:
    build:
      context: .
      dockerfile: Dockerfile
    image: icr-tienda:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ERP_API_URL=${ERP_API_URL:-https://erp.inversionesicr.com/api}
      - ERP_API_TOKEN=${ERP_API_TOKEN:-}
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      # Debe ser el nombre REAL de la red de Docker (n8n_default), no el
      # alias "traefik_public" que solo existe dentro de este compose —
      # con el alias, Traefik nunca encuentra la red y el dominio se queda
      # sin certificado real (sirve el autofirmado por defecto).
      - "traefik.docker.network=n8n_default"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.icr-tienda-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.icr-tienda-http.entrypoints=web"
      - "traefik.http.routers.icr-tienda-http.middlewares=icr-tienda-https-redirect"
      - "traefik.http.middlewares.icr-tienda-https-redirect.redirectscheme.scheme=https"
      # HTTPS with Let's Encrypt
      - "traefik.http.routers.icr-tienda.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.icr-tienda.entrypoints=websecure"
      - "traefik.http.routers.icr-tienda.tls=true"
      # "letsencrypt" no existe como certResolver en este Traefik — el único
      # definido en su configuración estática es "mytlschallenge" (ver
      # arranque del contenedor n8n-traefik-1). Con un resolver inexistente,
      # Traefik nunca emite certificado real y sirve el autofirmado por
      # defecto en su lugar.
      - "traefik.http.routers.icr-tienda.tls.certresolver=mytlschallenge"
      - "traefik.http.services.icr-tienda.loadbalancer.server.port=3000"

networks:
  # Misma red compartida de Traefik que ya usa el ERP (ICR-LOGISTICA) en este
  # VPS — ahí Traefik corre unido a la red por defecto de N8N (n8n_default),
  # no a una red "traefik_public" separada. Ver docker-compose.yml del ERP.
  traefik_public:
    name: n8n_default
    external: true
