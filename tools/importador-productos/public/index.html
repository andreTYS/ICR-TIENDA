<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Productos ICR · Alta rápida</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <aside class="panel form-panel">
      <div class="brand">
        <span class="brand-mark">ICR</span>
        <div>
          <h1>Nuevo producto</h1>
          <p class="sub">Arrastra una foto y llena los datos. Se guarda directo en PostgreSQL.</p>
        </div>
      </div>

      <form id="product-form">
        <div id="dropzone" class="dropzone">
          <input type="file" id="imagen" name="imagen" accept="image/*" hidden />
          <div id="dz-empty" class="dz-empty">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p><strong>Suelta la imagen aquí</strong><br/>o haz clic para elegirla</p>
          </div>
          <img id="dz-preview" class="dz-preview" hidden />
        </div>

        <label class="field">
          <span>Nombre del producto *</span>
          <input type="text" name="nombre" required placeholder="Ej. 100/20 MPPT BLUESOLAR" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Referencia interna</span>
            <input type="text" name="referencia_interna" placeholder="Ej. MPPT 100/20" />
          </label>
          <label class="field">
            <span>Categoría</span>
            <input type="text" name="categoria_producto" placeholder="Ej. CONTROLADORES" />
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>Costo (S/)</span>
            <input type="number" step="0.01" name="costo" placeholder="0.00" />
          </label>
          <label class="field">
            <span>Precio de venta (S/)</span>
            <input type="number" step="0.01" name="precio_venta" placeholder="0.00" />
          </label>
        </div>

        <label class="field">
          <span>Unidad de medida</span>
          <input type="text" name="unidad_medida" placeholder="Ej. Unidades" />
        </label>

        <button type="submit" id="submit-btn">Guardar producto</button>
        <p id="form-msg" class="form-msg" role="status"></p>
      </form>
    </aside>

    <main class="panel list-panel">
      <div class="list-header">
        <h2>Catálogo</h2>
        <span id="count-badge" class="badge">0 productos</span>
      </div>
      <input type="text" id="search" class="search-box" placeholder="Buscar por nombre, referencia o categoría..." />
      <div id="grid" class="grid"></div>
      <div id="pagination" class="pagination"></div>
    </main>

  <script src="app.js"></script>
</body>
</html>
